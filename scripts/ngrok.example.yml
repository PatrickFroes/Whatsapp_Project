# Configuração ngrok para WhatsApp Broker
# Salve este arquivo como: C:\Users\Striker\.ngrok2\ngrok.yml
# Ou execute: ngrok config add-authtoken SEU_TOKEN

version: '2'
authtoken: SEU_TOKEN_AQUI

tunnels:
  # Túnel principal - Interface do Call Center + API
  broker:
    addr: 3001
    proto: http
    # Se tiver conta paga, pode fixar o domínio:
    # domain: callcenter.ngrok-free.app

  # Túnel separado para Webhook (se preferir separar)
  # webhook:
  #   addr: 3001
  #   proto: http
  #   domain: webhook-whatsapp.ngrok-free.app
