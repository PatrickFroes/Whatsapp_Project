services:
  # Aplicação Node.js
  broker_app:
    build: .
    image: localhost/broker-app:latest
    container_name: broker_app
    restart: on-failure:3
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      # ⚠️ IMPORTANT: WhatsApp credentials are NOT set here!
      # Each tenant manages its own credentials via the Configuration table
      # This ensures complete multi-tenant isolation and per-tenant credential security
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: 5
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: 5
      AI_PROVIDER: ${AI_PROVIDER}
      AI_ENDPOINT: ${AI_ENDPOINT}
      AI_MODEL: ${AI_MODEL}
      AI_AUTH_USER: ${AI_AUTH_USER}
      AI_AUTH_PASS: ${AI_AUTH_PASS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - broker_default
    # Limites de recursos para 1 núcleo, 2GB RAM
    cpus: '0.8'
    mem_limit: 600m
    memswap_limit: 800m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Banco de Dados Principal (Relacional)
  postgres:
    image: postgres:15-alpine
    container_name: broker_postgres
    restart: on-failure:3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - broker_default
    cpus: '0.1'
    mem_limit: 800m

  # Cache & Sessões & Filas
  redis:
    image: redis:7-alpine
    container_name: broker_redis
    restart: on-failure:3
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 300m --maxmemory-policy allkeys-lru
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - broker_default
    cpus: '0.05'
    mem_limit: 400m

  # UI de Administração do Banco (Opcional - mas útil)
  pgadmin:
    image: dpage/pgadmin4
    container_name: broker_pgadmin
    restart: on-failure:1
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@broker.amber.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-ChangeMeToPgAdminPassword789!@#}
    ports:
      - '127.0.0.1:8080:80'
    networks:
      - broker_default
    cpus: '0.05'
    mem_limit: 300m

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: broker_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Volume para os certificados SSL copiados pelo certbot-init.sh
      - ./certs:/etc/nginx/ssl:ro
      # Volume para os desafios de renovação do Certbot
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - broker_app
    networks:
      - broker_default


volumes:
  postgres_data:
  redis_data:

networks:
  broker_default:
    driver: bridge

