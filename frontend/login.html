<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Broker - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/amberfy_theme.css?v=1.1" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: radial-gradient(circle, rgba(243,243,243,1) 0%, rgba(226,226,222,1) 100%);
      }
      .login-card {
        width: 100%;
        max-width: 450px;
      }
    </style>
  </head>
  <body>
    <div class="login-card login-amberfy-card">
      <h4 class="text-center mb-4 text-success"><i class="bi bi-whatsapp"></i> WhatsApp Broker</h4>
      <div id="errorMsg" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            required
            placeholder="admin@empresa.com"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">Entrar</button>
      </form>
      <p class="text-center mt-3 text-muted small">Use o email e senha cadastrados.</p>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (res.ok) {
            let redirectUrl = '';
            if (data.redirect) {
              redirectUrl = data.redirect;
            } else {
              const role = data.user.role ? data.user.role.toUpperCase() : '';
              if (role === 'SUPER_ADMIN') {
                redirectUrl = '/super.html';
              } else if (role === 'ADMIN' || role === 'OWNER') {
                redirectUrl = '/admin.html';
              } else if (role === 'SUPERVISOR') {
                redirectUrl = '/supervisor.html';
              } else {
                redirectUrl = '/agent.html';
              }
            }

            // Se estiver em iframe, define o token no window.name do iframe para não expor na aba Network ou URL
            if (window.self !== window.top) {
              window.name = data.token;
              window.location.href = redirectUrl;
            } else {
              window.location.href = redirectUrl;
            }
          } else {
            showError(data.error);
          }
        } catch (e) {
          showError('Erro de conexão');
        }
      });

      function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.innerText = msg;
        el.classList.remove('d-none');
      }
    </script>
  </body>
</html>
